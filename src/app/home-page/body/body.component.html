<div
  class="grid align-items-start justify-content-center my-5"
  style="min-height: 100vh"
>
  <div class="col md:col-6 pl-6">
    <div>
      <h1>Managing your assets has never been easier</h1>
      <hr class="blue-line" />
      <p class="my-5">
        Lorem ipsum dolor sit, amet consectetur adipisicing elit. Odio quam
        distinctio molestias labore soluta ducimus atque, culpa minus commodi
        dicta reprehenderit est, quis ipsam libero in quas quo modi animi?
      </p>
      <!-- <a [routerLink]="['/login']" class="p-button p-button-primary px-5"
        >Sign in</a
      > -->
      <div class="card flex justify-content-start">
        <p-button
          [disabled]="isLoggedIn()"
          [label]="isLoggedIn() ? 'Signed In' : 'Sign In'"
          [routerLink]="isLoggedIn() ? null : ['/login']"
          icon="pi pi-sign-in"
          [text]="true"
          [raised]="true"
          [styleClass]="'w-8rem'"
        ></p-button>
      </div>
    </div>
  </div>
  <div class="col md:col-6 flex justify-content-center align-items-center">
    <img
      class="w-full md:w-auto"
      src="../assets/Group.png"
      alt="Image description"
    />
  </div>
</div>
