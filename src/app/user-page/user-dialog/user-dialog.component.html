<p-dialog
  header="Insert User"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '40rem' }"
  (onHide)="onCancel()"
>
  <span *ngIf="formSubmitted && form.invalid" class="block mb-5 error-message">
    All fields must be filled
  </span>

  <form [formGroup]="form" (ngSubmit)="onSave()">
    <div class="flex flex-wrap justify-content-center gap-4">
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <input
            pInputText
            id="new-username"
            formControlName="username"
            autocomplete="new-username"
          />
          <label for="new-username"
            ><span class="required">*</span> Username</label
          >
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <p-password
            id="new-password"
            formControlName="password"
            [feedback]="false"
            autocomplete="new-password"
          />
          <label for="new-password"
            ><span class="required">*</span> Password</label
          >
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <input pInputText id="firstname" formControlName="firstname" />
          <label for="firstname"
            ><span class="required">*</span> First Name</label
          >
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <input pInputText id="surname" formControlName="surname" />
          <label for="surname"><span class="required">*</span> Surname</label>
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center">
        <p-dropdown
          class="fixed-dropdown"
          [options]="roles"
          formControlName="role"
          [checkmark]="true"
          [showClear]="true"
          optionLabel="name"
          placeholder="Select a Role"
        ></p-dropdown>
      </div>
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <input pInputText id="email" formControlName="email" />
          <label for="email"><span class="required">*</span> Email</label>
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <p-calendar
            inputId="birth_date"
            formControlName="birthdate"
            dateFormat="dd.mm.yy"
            appendTo="body"
          ></p-calendar>
          <label for="birth_date"
            ><span class="required">*</span> Birth Date</label
          >
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center">
        <p-floatLabel>
          <p-inputMask
            mask="999-99-99-999"
            slotChar=" "
            formControlName="phoneNumber"
          ></p-inputMask>
          <label for="phoneNumber"
            ><span class="required">*</span> Phone Number</label
          >
        </p-floatLabel>
      </div>
      <div class="card flex justify-content-center gap-2">
        <p-button label="Cancel" severity="secondary" (onClick)="onCancel()" />
        <p-button label="Save" type="submit" />
      </div>
    </div>
  </form>
</p-dialog>
