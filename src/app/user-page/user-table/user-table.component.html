<div class="card mt-3 px-5 pb-5">
  <!-- Table configuration -->
  <p-table
    #dt2
    [value]="users"
    dataKey="id"
    [paginator]="true"
    [rows]="pageSize"
    [rowsPerPageOptions]="[10, 25, 50]"
    [loading]="loading"
    [globalFilterFields]="[
      'firstname',
      'surname',
      'username',
      'phoneNumber',
      'email',
      'birthdate',
      'role'
    ]"
    [lazy]="true"
    [totalRecords]="totalElements"
    [tableStyle]="{ 'min-width': '75rem', 'table-layout': 'fixed' }"
    (onLazyLoad)="onPageChange($event)"
  >
    <!-- Caption with Search -->
    <ng-template pTemplate="caption">
      <div class="flex justify-content-between align-items-center">
        <h4 class="m-0">User Table</h4>
        <div class="flex align-items-center">
          <span class="pi pi-search mr-2"></span>
          <input
            type="text"
            pInputText
            placeholder="Search keyword"
            (input)="dt2.filterGlobal(getInputValue($event), 'contains')"
          />
        </div>
      </div>
    </ng-template>

    <!-- Table Header with Pop-Up Filters -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 5%">ID</th>
        <th style="width: 12%">
          First Name
          <p-columnFilter
            type="text"
            field="firstname"
            display="menu"
            placeholder="Filter by First Name"
          ></p-columnFilter>
        </th>
        <th style="width: 12%">
          Surname
          <p-columnFilter
            type="text"
            field="surname"
            display="menu"
            placeholder="Filter by Surname"
          ></p-columnFilter>
        </th>
        <th style="width: 12%">
          Username
          <p-columnFilter
            type="text"
            field="username"
            display="menu"
            placeholder="Filter by Username"
          ></p-columnFilter>
        </th>
        <th style="width: 16%">
          Phone Number
          <p-columnFilter
            type="text"
            field="phoneNumber"
            display="menu"
            placeholder="Filter by Phone Number"
          ></p-columnFilter>
        </th>
        <th style="width: 16%">
          Email
          <p-columnFilter
            type="text"
            field="email"
            display="menu"
            placeholder="Filter by Email"
          ></p-columnFilter>
        </th>
        <th style="width: 10%">
          Birthdate
          <p-columnFilter
            type="date"
            field="birthdate"
            display="menu"
            placeholder="Filter by Birthdate"
          ></p-columnFilter>
        </th>
        <th style="width: 12%">
          Role
          <p-columnFilter
            field="role"
            matchMode="equals"
            display="menu"
            placeholder="Filter by Role"
          >
            <ng-template pTemplate="filter" let-filter="filterCallback">
              <p-multiSelect
                [options]="roles"
                [(ngModel)]="selectedRoles"
                placeholder="Select Roles"
                [style]="{ 'min-width': '12rem', width: '100%' }"
                (onChange)="filter($event.value)"
              ></p-multiSelect>
            </ng-template>
          </p-columnFilter>
        </th>
      </tr>
    </ng-template>

    <!-- Table Body -->
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.firstname }}</td>
        <td>{{ user.surname }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.phoneNumber }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.birthdate | date }}</td>
        <td>{{ user.role }}</td>
      </tr>
    </ng-template>

    <!-- Empty Table Message -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" class="text-center">No users found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
