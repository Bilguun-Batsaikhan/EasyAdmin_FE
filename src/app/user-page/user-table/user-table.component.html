<div class="card mt-3 p-5">
  <p-table
    [value]="users"
    [tableStyle]="{ 'min-width': '20rem' }"
    [styleClass]="selectedSize.class"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalElements"
    [lazy]="true"
    (onLazyLoad)="onPageChange($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Surname</th>
        <th>Username</th>
        <th>Phone Number</th>
        <th>Email</th>
        <th>Birthdate</th>
        <th>Role</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.firstname }}</td>
        <td>{{ user.surname }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.phoneNumber }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.birthdate }}</td>
        <td>{{ user.role }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
