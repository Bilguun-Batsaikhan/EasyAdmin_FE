<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div class="surface-100 flex flex-column h-22rem custom-border-round">
    <div
      class="flex align-items-center justify-content-center h-4rem font-bold border-round mt-4"
    >
      <h1>Login</h1>
    </div>
    <div class="relative-container">
      <p-floatLabel
        class="flex align-items-center justify-content-center h-4rem font-bold border-round mx-4"
      >
        <input
          pInputText
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter email"
        />
        <label for="email">Email</label>
      </p-floatLabel>
      <!-- Validation of email -->
      <div
        *ngIf="
          loginForm.get('email')?.invalid && loginForm.get('email')?.touched
        "
        class="validation-message absolute-message"
      >
        <div *ngIf="loginForm.get('email')?.errors?.['required']">
          Email is required.
        </div>
        <div *ngIf="loginForm.get('email')?.errors?.['email']">
          Email is invalid.
        </div>
      </div>
    </div>
    <div class="relative-container">
      <p-floatLabel
        class="flex align-items-center justify-content-center h-4rem font-bold border-round mx-4"
      >
        <input
          pInputText
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter password"
        />
        <label for="password">Password</label>
      </p-floatLabel>
      <!-- Validation of password -->
      <div
        *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        "
        class="validation-message absolute-message"
      >
        <div *ngIf="loginForm.get('password')?.errors?.['required']">
          Password is required.
        </div>
        <div *ngIf="loginForm.get('password')?.errors?.['minlength']">
          Password must be at least 8 characters long.
        </div>
      </div>
    </div>
    <button
      type="submit"
      pButton
      label="Submit"
      class="flex align-items-center justify-content-center font-bold border-round m-2 mx-6"
    ></button>
  </div>
</form>
