<app-navigation-bar></app-navigation-bar>
<div class="grid justify-content-center my-5" style="min-height: 100vh">
  <p-toast />
  <p-confirmPopup />
  <div
    class="col-12 sm:col-12 md:col-6 flex justify-content-center align-items-start"
  >
    <form
      [formGroup]="resetForm"
      (ngSubmit)="onSubmit($event)"
      class="flex flex-column h-22rem custom-border-round px-5"
      style="background-color: #262626"
    >
      <div
        class="flex align-items-center justify-content-center h-4rem font-bold border-round mt-4 col-white-smoke"
      >
        <h4>Password Reset</h4>
      </div>
      <div class="align-items-start">
        <label for="passRecovery" class="col-white-smoke">Password</label>
        <div
          class="mt-2 relative-container flex align-items-center justify-content-center flex-column gap-2"
        >
          <input
            pInputText
            type="password"
            id="passRecovery"
            formControlName="passRecovery"
            placeholder="Enter password"
          />

          <div
            *ngIf="
              resetForm.get('passRecovery')?.invalid &&
              resetForm.get('passRecovery')?.touched
            "
            class="validation-message absolute-message"
          >
            <div *ngIf="resetForm.get('passRecovery')?.errors?.['required']">
              Password is required.
            </div>
          </div>
        </div>
      </div>
      <div class="align-items-start">
        <label for="passRecovery" class="col-white-smoke"
          >Confirm password</label
        >
        <div
          class="mt-2 relative-container flex align-items-center justify-content-center flex-column gap-2"
        >
          <p-password
            [(ngModel)]="confirmPassword"
            [feedback]="false"
            type="password"
            id="passRecovery"
            formControlName="passRecovery"
            placeholder="Rewrite password"
          />

          <div
            *ngIf="
              resetForm.get('passRecovery')?.invalid &&
              resetForm.get('passRecovery')?.touched
            "
            class="validation-message absolute-message"
          >
            <div *ngIf="resetForm.get('passRecovery')?.errors?.['required']">
              Password is required.
            </div>
          </div>
        </div>
      </div>
      <p-button
        type="submit"
        label="Reset"
        icon="pi pi-user-edit"
        [raised]="true"
        [loading]="loading"
        styleClass="custom-button flex align-items-center justify-content-center font-bold border-round m-4 mx-6"
      ></p-button>
    </form>
  </div>
  <div
    class="col-12 sm:col-12 md:col-6 flex justify-content-center align-items-start"
  >
    <img
      class="w-full sm:w-full md:w-auto"
      src="../assets/Group.png"
      alt="Image description"
    />
  </div>
</div>

<app-footer></app-footer>
